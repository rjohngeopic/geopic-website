<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>GeoPic – LinkedIn-Banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#3a3a38;
    display:flex; flex-direction:column; align-items:center;
    padding:40px 20px; gap:20px;
    font-family:'Geist', system-ui, sans-serif;
  }
  .hint { color:#ddd; font-size:14px; font-family:'Space Mono', monospace; letter-spacing:0.04em; }

  /* ── BANNER: exakt LinkedIn-Maße 1584 × 396 ── */
  .banner {
    width:1584px; height:396px;
    position:relative; overflow:hidden;
    background-color:#0c0c0b;
    background-image:url('Beyond-OG.jpg');
    background-repeat:no-repeat;
    background-position:left center;
    background-size:auto 100%;
  }
  /* Feather: Bild rechts sanft in Schwarz auslaufen lassen → nahtlos */
  .banner::after {
    content:''; position:absolute; inset:0;
    background:linear-gradient(to right,
      rgba(12,12,11,0) 0%,
      rgba(12,12,11,0) 38%,
      rgba(12,12,11,0.85) 56%,
      #0c0c0b 70%);
  }
  .text {
    position:absolute; right:110px; top:50%;
    transform:translateY(-50%);
    text-align:right; z-index:2;
  }
  .eyebrow {
    font-family:'Space Mono', monospace;
    font-size:15px; letter-spacing:0.18em; text-transform:uppercase;
    color:#f4731f; margin-bottom:20px;
  }
  .headline {
    font-weight:700; font-size:62px; line-height:1.04;
    letter-spacing:-0.02em; color:#ebe7dd;
  }
  .headline span { display:block; color:#f4731f; }
</style>
</head>
<body>

  <div class="hint">↓ LinkedIn-Banner · 1584 × 396 px · für Upload abfotografieren / screenshotten</div>

  <div class="banner">
    <div class="text">
      <div class="eyebrow">Produktvisualisierung · Weltmarken-Niveau</div>
      <div class="headline">Produkte inszenieren.<span>Auf den Punkt.</span></div>
    </div>
  </div>

</body>
</html>
